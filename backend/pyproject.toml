[project]
name = "health-backend"
version = "0.1.0"
description = "Healthcare navigation assistant backend: LLM conversation + Jev decisions"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "groq>=1.7.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "typesafe-sdk>=0.7.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls REAL paid/rate-limited APIs. Never run by default. Run: uv run pytest -m live tests/live"]
# Live tests are excluded and outbound network is blocked by default (cost protection).
addopts = "-m 'not live' --disable-socket --allow-hosts=127.0.0.1,localhost,::1"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]  # the formatter owns line length

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
